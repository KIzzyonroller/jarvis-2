<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Juno Desktop</title>
<style>
/* The living desktop: this page IS the wallpaper (livedesk.py puts its window behind the desktop icons).
   It spans every monitor; livedesk tells it where each monitor sits. Nothing here takes clicks. */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0a16;cursor:default;user-select:none}
svg,canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas{pointer-events:none}
#vizbox canvas{position:fixed;inset:auto;width:auto;height:auto}
#juno-gl,#juno-fx,#juno-rig{position:fixed;inset:auto;opacity:0;transform-origin:50% 90%}
#juno-gl{visibility:hidden}
/* the holographic panels (desk_holo.js), in her colours */
@font-face{font-family:"Michroma";font-weight:400;font-display:swap;src:url(fonts/michroma-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url(fonts/jost-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Jost";font-weight:500;font-display:swap;src:url(fonts/jost-latin-500-normal.woff2) format("woff2")}
:root{--c:#c97bff;--crgb:201,123,255;--vrgb:7,4,13;--ink:#f1e6ff;--dim:#8a76a3;--alarm:#ff5ae0;--argb:255,90,224;
  --display:"Michroma",sans-serif;--dispw:400;--text:"Jost","Segoe UI",sans-serif;--textw:400}
body{color:var(--ink);font:400 13px/1.4 var(--text)}
.hp svg{position:static;inset:auto}
.hp ul,.hp pre{margin:0;padding:0}       /* the panels' own icons, not full-screen layers */
/* ============================================================ holographic panels: what he's doing, beside him */
#holo{position:fixed;inset:0;z-index:4;pointer-events:none}
body.glass-up #holo{opacity:0;transition:opacity .3s}
/* ============================================================ desktop widgets (desk_widgets.js): look-only, live */
#widgets{position:fixed;z-index:3;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:14px;overflow:hidden;pointer-events:none;transition:opacity .4s}
#widgets.rt{flex-wrap:wrap-reverse}
#widgets > .wd{width:var(--ww,300px);box-sizing:border-box}
#widgets.off,body.glass-up #widgets{opacity:0}
.wd{position:relative;color:var(--ink);background:linear-gradient(180deg,rgba(var(--crgb),.10),rgba(var(--vrgb),.78) 40%);
  border:1px solid rgba(var(--crgb),.30);box-shadow:0 0 30px rgba(var(--crgb),.10),inset 0 0 20px rgba(var(--crgb),.05);animation:hpIn .5s cubic-bezier(.2,.8,.2,1) both}
.wd[hidden]{display:none}
.wd::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,transparent 0 2px,rgba(var(--crgb),.035) 2px 3px)}
.wd .wh{display:flex;align-items:center;gap:8px;height:26px;padding:0 11px;border-bottom:1px solid rgba(var(--crgb),.2);
  font:var(--dispw) 9.5px/1 var(--display);letter-spacing:.2em;color:var(--c);white-space:nowrap}
:root[data-ai=ultron] .wd .wh{font-size:12.5px;letter-spacing:.12em}
.wd .wh i{width:6px;height:6px;flex:none;background:var(--c);transform:rotate(45deg)}
.wd .wh b{font-weight:inherit}
.wd .wh span{margin-left:auto;font:400 11px var(--text);letter-spacing:0;color:var(--dim);overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.wd .wb{position:relative;padding:10px 11px 11px;font-size:12.5px;line-height:1.4}
/* stats */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gauge{width:100%;height:auto;position:static}
.gauge circle{fill:none;stroke-width:7}
.gauge .g0{stroke:rgba(var(--crgb),.14)}
.gauge .g1{stroke:var(--c);stroke-dasharray:264;stroke-dashoffset:264;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50px 50px;transition:stroke-dashoffset .8s,stroke .3s}
.gauge.hot .g1{stroke:var(--alarm)}
.gauge text{text-anchor:middle;fill:var(--ink)}
.gauge .gv{font:500 19px var(--text);font-variant-numeric:tabular-nums}
.gauge .gl{font:var(--dispw) 8px var(--display);letter-spacing:.15em;fill:var(--dim)}
.bars{display:grid;gap:6px;margin-top:8px}
.br{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12px}
.br[hidden]{display:none}
.br span{color:var(--dim)} .br b{font-weight:500;font-variant-numeric:tabular-nums}
.br i{grid-column:1/-1;height:3px;background:rgba(var(--crgb),.14)}
.br em{display:block;height:100%;width:0;background:var(--c);transition:width .8s}
.br.hot em{background:var(--alarm)} .br.hot b{color:var(--alarm)}
.spark{position:static;width:100%;height:28px;margin-top:8px;display:block}
.spark polyline{fill:none;stroke-width:1.4;vector-effect:non-scaling-stroke}
.spark .sc{stroke:var(--c)} .spark .sg{stroke:var(--ink);opacity:.45}
.foot{display:flex;gap:12px;margin-top:4px;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.foot .upt{margin-left:auto}
/* now playing */
.np-t{font:500 16px/1.25 var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-a{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:3px;background:rgba(var(--crgb),.16);margin-top:8px}
.pbar em{display:block;height:100%;width:0;background:var(--c);transition:width 1s linear}
.np-time{font-size:11px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums}
.wd-music.paused .np-t{opacity:.6}
/* weather */
.wx-top{display:flex;align-items:center;gap:12px}
.wxi{position:static;fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.wx-now{font:300 30px/1 var(--text);font-variant-numeric:tabular-nums}
.wx-l{color:var(--dim);font-size:12px;margin-top:3px}
.wx-hl{margin-left:auto;text-align:right;font-size:12px} .wx-hl b{display:block;font-weight:500} .wx-hl span{color:var(--dim)}
.wx-strip{display:grid;grid-template-columns:repeat(6,1fr);margin-top:10px;padding-top:8px;border-top:1px solid rgba(var(--crgb),.14)}
.wx-h{display:grid;justify-items:center;gap:2px;font-size:10.5px;color:var(--dim)}
.wx-h b{color:var(--ink);font-weight:500} .wx-h.wet .wxi{stroke:var(--ink)}
/* today */
.cal-next{color:var(--c);font-size:12.5px;margin-bottom:6px}
.cal{list-style:none;margin:0;padding:0}
.cal li{display:grid;grid-template-columns:66px 1fr;gap:8px;padding:4px 0;border-top:1px solid rgba(var(--crgb),.1);font-size:12.5px}
.cal li b{font-weight:500;color:var(--c);font-size:12px} .cal li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal li.past{opacity:.4}
.empty{color:var(--dim)}
/* notes */
.tm{display:grid;grid-template-columns:1fr auto;gap:3px 8px;margin-bottom:8px}
.tm b{font:500 18px/1 var(--text);color:var(--c);font-variant-numeric:tabular-nums}
.tm i{grid-column:1/-1;height:3px;background:rgba(var(--crgb),.14)} .tm em{display:block;height:100%;background:var(--c)}
.tm.ring b{color:var(--alarm)}
.sticky{border-left:2px solid #ffd666;padding:3px 0 3px 9px;margin-bottom:8px}
.sticky b{display:block;font-weight:500;font-size:11.5px;color:#ffd666} .sticky p{margin:2px 0 0;white-space:pre-wrap;max-height:4.2em;overflow:hidden}
.lst b{display:block;font-weight:500;font-size:11.5px;color:var(--c);margin-bottom:3px}
.lst ul{list-style:none;margin:0;padding:0} .lst li{padding:1px 0 1px 16px;position:relative;font-size:12px}
.lst li::before{content:"";position:absolute;left:0;top:6px;width:8px;height:8px;border:1px solid var(--c)}
.lst li.done{color:var(--dim);text-decoration:line-through} .lst li.done::before{background:var(--c)}
/* discord */
.dm{display:grid;grid-template-columns:1fr auto;gap:1px 8px;padding:4px 0;border-top:1px solid rgba(var(--crgb),.1)}
.dm:first-child{border-top:0}
.dm b{font-weight:500;font-size:11.5px;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm em{font-style:normal;font-size:10.5px;color:var(--dim)}
.dm p{grid-column:1/-1;margin:0;font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (prefers-reduced-motion:reduce){.wd{animation:none}}

.hp{position:absolute;width:var(--w,270px);max-height:196px;overflow:hidden;color:var(--ink);
  background:linear-gradient(180deg,rgba(var(--crgb),.11),rgba(var(--vrgb),.82) 46%);
  border:1px solid rgba(var(--crgb),.38);box-shadow:0 0 34px rgba(var(--crgb),.14),inset 0 0 22px rgba(var(--crgb),.07);
  animation:hpIn .5s cubic-bezier(.2,.8,.2,1) both;transition:top .45s cubic-bezier(.2,.8,.2,1),left .45s cubic-bezier(.2,.8,.2,1),opacity .7s,filter .7s,transform .7s}
.hp::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 2px,rgba(var(--crgb),.045) 2px 3px)}
.hp::after{content:"";position:absolute;left:0;right:0;height:40%;top:0;pointer-events:none;transform:translateY(-100%);
  background:linear-gradient(180deg,transparent,rgba(var(--crgb),.10),transparent);animation:hpScan 2.6s linear infinite}
.hp.done::after{animation:none;opacity:0}
.hp.out{opacity:0;filter:blur(5px) brightness(1.6);transform:scale(.97)}
.hp.fail{border-color:rgba(var(--argb),.6)}
@keyframes hpIn{0%{opacity:0;clip-path:inset(49% 0 49% 0);filter:brightness(2.4)}55%{opacity:1;clip-path:inset(0 0 0 0)}100%{filter:none;clip-path:inset(0 0 0 0)}}
@keyframes hpScan{to{transform:translateY(250%)}}
.hp .hh{display:flex;align-items:center;gap:8px;height:25px;padding:0 10px;border-bottom:1px solid rgba(var(--crgb),.22);
  font:var(--dispw) 9.5px/1 var(--display);letter-spacing:.2em;color:var(--c);white-space:nowrap}
:root[data-ai=ultron] .hp .hh{font-size:12.5px;letter-spacing:.12em}
.hp .hh i{width:6px;height:6px;flex:none;background:var(--c);transform:rotate(45deg);animation:blink .7s steps(2) infinite}
.hp.done .hh i{animation:none} .hp.fail .hh i{background:var(--alarm)}
.hp .hh span{margin-left:auto;font:400 11px var(--text);letter-spacing:0;color:var(--dim);font-variant-numeric:tabular-nums}
.hp .bd{position:relative;padding:9px 10px 10px;font-size:12.5px;line-height:1.45}
.hp .sub{color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp .big{font:500 17px/1.25 var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hp .row{display:flex;gap:10px;align-items:center}
/* search: radar sweep */
.radar{width:78px;height:78px;flex:none}
.radar circle,.radar line{fill:none;stroke:rgba(var(--crgb),.35);stroke-width:.8}
.radar .sw{transform-origin:50px 50px;animation:spin 1.6s linear infinite}
.radar .sw path{fill:url(#rg);stroke:none}
.radar .bl{fill:var(--c);stroke:none;opacity:0;animation:blip 1.6s linear infinite}
.hp.done .radar .sw{animation-duration:4s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%,40%{opacity:0}45%{opacity:1}100%{opacity:0}}
/* terminal */
.term{font:11.5px/1.45 "Cascadia Mono",Consolas,monospace;margin:0;white-space:pre-wrap;word-break:break-all;max-height:150px;overflow:hidden;color:var(--ink)}
.term b{color:var(--c);font-weight:400}
.term .cur{display:inline-block;width:7px;height:12px;background:var(--c);vertical-align:-1px;animation:blink .8s steps(2) infinite}
/* lists */
.hl{list-style:none;font-size:12px;line-height:1.5}
.hl li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;animation:liIn .3s ease-out forwards}
.hl li::before{content:"";display:inline-block;width:4px;height:4px;margin:0 7px 2px 0;background:var(--c);transform:rotate(45deg)}
@keyframes liIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
/* launch / progress */
.seg{display:flex;gap:3px;margin-top:8px}
.seg i{flex:1;height:6px;background:rgba(var(--crgb),.14)}
.seg i{animation:segOn 1.1s steps(1) infinite}
.hp.done .seg i{animation:none;background:var(--c)}
@keyframes segOn{0%{background:rgba(var(--crgb),.14)}50%{background:var(--c)}}
/* media */
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border:1px solid rgba(var(--crgb),.25);margin-bottom:6px;max-height:112px}
.eq{display:flex;gap:3px;align-items:flex-end;height:30px;margin-top:6px}
.eq i{flex:1;background:var(--c);height:100%;transform-origin:bottom;transform:scaleY(.2);animation:eq .9s ease-in-out infinite alternate;opacity:.85}
@keyframes eq{to{transform:scaleY(1)}}
/* level */
.lvl{font:var(--dispw) 30px/1 var(--display);color:var(--c)}
.lvlbar{height:5px;background:rgba(var(--crgb),.14);margin-top:8px}.lvlbar i{display:block;height:100%;background:var(--c);transition:width .8s}
/* gauges */
.gs{display:grid;grid-template-columns:62px 1fr 34px;gap:5px 8px;align-items:center;font-size:11.5px}
.gs i{height:4px;background:rgba(var(--crgb),.14);position:relative}.gs i b{position:absolute;inset:0 auto 0 0;background:var(--c);transition:width 1s}
/* screen scan */
.shot{position:relative;min-height:80px}
.shot img{width:100%;display:block;max-height:140px;object-fit:cover;object-position:top;filter:saturate(.6) contrast(1.1)}
.shot::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--c);box-shadow:0 0 12px var(--c);top:0;animation:shotScan 1.8s ease-in-out infinite alternate}
.hp.done .shot::after{opacity:0}
@keyframes shotScan{to{top:calc(100% - 2px)}}
.shot .ph{color:var(--dim);font-size:12px;padding:24px 0;text-align:center}
/* blender cube */
.cube3{width:64px;height:64px;margin:6px auto 4px;perspective:260px}
.cube3 div{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:cube 6s linear infinite}
.cube3 span{position:absolute;inset:0;border:1px solid var(--c);background:rgba(var(--crgb),.06)}
.cube3 span:nth-child(1){transform:translateZ(32px)}.cube3 span:nth-child(2){transform:rotateY(180deg) translateZ(32px)}
.cube3 span:nth-child(3){transform:rotateY(90deg) translateZ(32px)}.cube3 span:nth-child(4){transform:rotateY(-90deg) translateZ(32px)}
.cube3 span:nth-child(5){transform:rotateX(90deg) translateZ(32px)}.cube3 span:nth-child(6){transform:rotateX(-90deg) translateZ(32px)}
@keyframes cube{to{transform:rotateX(-20deg) rotateY(360deg)}}
.cube3 div{transform:rotateX(-20deg)}
/* targeting */
.tgt{width:64px;height:64px;flex:none}
.tgt circle,.tgt line{fill:none;stroke:var(--c);stroke-width:1}
.tgt .rot{transform-origin:32px 32px;animation:spin 3s linear infinite}
/* reasoning */
.think{font-size:11.5px;line-height:1.5;color:var(--dim);max-height:140px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 30%)}
.think b{color:var(--ink);font-weight:400}
@media (prefers-reduced-motion:reduce){.hp,.hp::after{animation:none!important}}
/* briefing cards */
.wx{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.wx svg{width:46px;height:46px;grid-row:1/3;color:var(--c)}
.wx svg *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wx .t{font:var(--dispw) 28px/1 var(--display);color:var(--ink)}
:root[data-ai=ultron] .wx .t{font-size:34px}
.wx .t .u{font:400 17px var(--text);margin-left:3px;vertical-align:6px;color:var(--dim)}
.wx .l{font-size:12.5px;color:var(--dim);line-height:1.3}
.wx .r{grid-column:1/3;display:flex;gap:14px;font-size:12px;color:var(--dim);margin-top:4px}
.wx .r b{color:var(--ink);font-weight:500}
.hl.plain li::before{background:var(--dim)}
.hl li b{font-weight:500;color:var(--c);margin-right:6px}


@media (prefers-reduced-motion:reduce){.hp *{animation:none!important}}
</style></head>
<body>
<svg id="desk" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
<div id="vizbox"></div>
<!-- She isn't on the desktop any more (she lives on the music player); these stay empty. -->
<canvas id="juno-rig" aria-hidden="true"></canvas>
<canvas id="juno-gl" aria-hidden="true"></canvas>
<canvas id="juno-fx" aria-hidden="true"></canvas>
<div id="holo" aria-hidden="true"><svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="currentColor" stop-opacity="0"/><stop offset="1" stop-color="currentColor" stop-opacity=".55"/></linearGradient></defs></svg></div>
<canvas id="intro"></canvas>
<script src="cast.js"></script>
<script src="desk_holo.js"></script>
<script src="desk_widgets.js"></script>
<script src="desktop.js"></script>
</body></html>
