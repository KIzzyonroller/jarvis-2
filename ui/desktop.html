<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Jarvis Desktop</title>
<style>
/* The living desktop: this page IS the wallpaper (livedesk.py puts its window behind the desktop icons).
   It spans every monitor; livedesk tells it where each monitor sits. Nothing here takes clicks. */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1b2e;cursor:default;user-select:none}
svg,canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas{pointer-events:none}
#vizbox canvas{position:fixed;inset:auto;width:auto;height:auto}
#scenes{position:fixed;inset:0;z-index:0}
.scene{position:fixed;background:center/cover no-repeat}
.scene svg.labels{position:absolute;inset:0;width:100%;height:100%}
#vizbox{position:fixed;inset:0;z-index:1;pointer-events:none}
/* calm (Settings > His desktop > Calm panels, on by default): panels and widgets just appear, nothing sweeps,
   scans, blinks or spins. Bars and gauges still show their value, they just don't glide to it. */
body.calm .hp,body.calm .hp *,body.calm .hp::after,body.calm .wd,body.calm .wd *,body.calm #widgets{animation:none!important;transition:none!important}
body.calm .hp::after{display:none}
body.calm .hl li{opacity:1}
/* the holographic panels (desk_holo.js), in his colours */
@font-face{font-family:"Michroma";font-weight:400;font-display:swap;src:url(fonts/michroma-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url(fonts/jost-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Jost";font-weight:500;font-display:swap;src:url(fonts/jost-latin-500-normal.woff2) format("woff2")}
:root{--c:#a9d4ff;--crgb:169,212,255;--vrgb:11,27,46;--ink:#e7f2ff;--dim:#9cb7d3;--alarm:#ffb347;--argb:255,179,71;
  --display:"Michroma",sans-serif;--dispw:400;--text:"Jost","Segoe UI",sans-serif;--textw:400}
body{color:var(--ink);font:400 13px/1.4 var(--text)}
.hp svg{position:static;inset:auto}
.hp ul,.hp pre{margin:0;padding:0}       /* the panels' own icons, not full-screen layers */
/* ============================================================ holographic panels: what he's doing, beside him */
#holo{position:fixed;inset:0;z-index:4;pointer-events:none}
body.glass-up #holo{opacity:0;transition:opacity .3s}
/* ============================================================ desktop widgets (desk_widgets.js): look-only, live */
#widgets{position:fixed;z-index:3;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:14px;overflow:hidden;pointer-events:none;transition:opacity .4s}
#widgets.rt{flex-wrap:wrap-reverse}
#widgets > .wd{width:var(--ww,300px);box-sizing:border-box}
#widgets-free{position:fixed;inset:0;z-index:3;pointer-events:none;transition:opacity .4s}
#widgets-free > .wd{position:absolute;width:var(--ww,300px);box-sizing:border-box}
#widgets-free.off,body.glass-up #widgets-free{opacity:0}
body.focusing #widgets-free{opacity:.15}
#widgets.off,body.glass-up #widgets{opacity:0}
.wd{position:relative;color:var(--ink);background:linear-gradient(180deg,rgba(var(--crgb),.10),rgba(var(--vrgb),.78) 40%);
  border:1px solid rgba(var(--crgb),.30);box-shadow:0 0 30px rgba(var(--crgb),.10),inset 0 0 20px rgba(var(--crgb),.05);animation:hpIn .5s cubic-bezier(.2,.8,.2,1) both}
.wd[hidden]{display:none}
.wd::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,transparent 0 2px,rgba(var(--crgb),.035) 2px 3px)}
.wd .wh{display:flex;align-items:center;gap:8px;height:26px;padding:0 11px;border-bottom:1px solid rgba(var(--crgb),.2);
  font:var(--dispw) 9.5px/1 var(--display);letter-spacing:.2em;color:var(--c);white-space:nowrap}
:root[data-ai=ultron] .wd .wh{font-size:12.5px;letter-spacing:.12em}
.wd .wh i{width:6px;height:6px;flex:none;background:var(--c);transform:rotate(45deg)}
.wd .wh b{font-weight:inherit}
.wd .wh span{margin-left:auto;font:400 11px var(--text);letter-spacing:0;color:var(--dim);overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.wd .wb{position:relative;padding:10px 11px 11px;font-size:12.5px;line-height:1.4}
/* stats */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gauge{width:100%;height:auto;position:static}
.gauge circle{fill:none;stroke-width:7}
.gauge .g0{stroke:rgba(var(--crgb),.14)}
.gauge .g1{stroke:var(--c);stroke-dasharray:264;stroke-dashoffset:264;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50px 50px;transition:stroke-dashoffset .8s,stroke .3s}
.gauge.hot .g1{stroke:var(--alarm)}
.gauge text{text-anchor:middle;fill:var(--ink)}
.gauge .gv{font:500 19px var(--text);font-variant-numeric:tabular-nums}
.gauge .gl{font:var(--dispw) 8px var(--display);letter-spacing:.15em;fill:var(--dim)}
.bars{display:grid;gap:6px;margin-top:8px}
.br{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12px}
.br[hidden]{display:none}
.br span{color:var(--dim)} .br b{font-weight:500;font-variant-numeric:tabular-nums}
.br i{grid-column:1/-1;height:3px;background:rgba(var(--crgb),.14)}
.br em{display:block;height:100%;width:0;background:var(--c);transition:width .8s}
.br.hot em{background:var(--alarm)} .br.hot b{color:var(--alarm)}
.spark{position:static;width:100%;height:28px;margin-top:8px;display:block}
.spark polyline{fill:none;stroke-width:1.4;vector-effect:non-scaling-stroke}
.spark .sc{stroke:var(--c)} .spark .sg{stroke:var(--ink);opacity:.45}
.foot{display:flex;gap:12px;margin-top:4px;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.foot .upt{margin-left:auto}
/* now playing */
.np-t{font:500 16px/1.25 var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-a{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:3px;background:rgba(var(--crgb),.16);margin-top:8px}
.pbar em{display:block;height:100%;width:0;background:var(--c);transition:width 1s linear}
.np-time{font-size:11px;color:var(--dim);margin-top:4px;font-variant-numeric:tabular-nums}
.wd-music.paused .np-t{opacity:.6}
/* weather */
.wx-top{display:flex;align-items:center;gap:12px}
.wxi{position:static;fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.wx-now{font:300 30px/1 var(--text);font-variant-numeric:tabular-nums}
.wx-l{color:var(--dim);font-size:12px;margin-top:3px}
.wx-hl{margin-left:auto;text-align:right;font-size:12px} .wx-hl b{display:block;font-weight:500} .wx-hl span{color:var(--dim)}
.wx-strip{display:grid;grid-template-columns:repeat(6,1fr);margin-top:10px;padding-top:8px;border-top:1px solid rgba(var(--crgb),.14)}
.wx-h{display:grid;justify-items:center;gap:2px;font-size:10.5px;color:var(--dim)}
.wx-h b{color:var(--ink);font-weight:500} .wx-h.wet .wxi{stroke:var(--ink)}
/* today */
.cal-next{color:var(--c);font-size:12.5px;margin-bottom:6px}
.cal{list-style:none;margin:0;padding:0}
.cal li{display:grid;grid-template-columns:66px 1fr;gap:8px;padding:4px 0;border-top:1px solid rgba(var(--crgb),.1);font-size:12.5px}
.cal li b{font-weight:500;color:var(--c);font-size:12px} .cal li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal li.past{opacity:.4}
.empty{color:var(--dim)}
/* notes */
.tm{display:grid;grid-template-columns:1fr auto;gap:3px 8px;margin-bottom:8px}
.tm b{font:500 18px/1 var(--text);color:var(--c);font-variant-numeric:tabular-nums}
.tm i{grid-column:1/-1;height:3px;background:rgba(var(--crgb),.14)} .tm em{display:block;height:100%;background:var(--c)}
.tm.ring b{color:var(--alarm)}
.sticky{border-left:2px solid #ffd666;padding:3px 0 3px 9px;margin-bottom:8px}
.sticky b{display:block;font-weight:500;font-size:11.5px;color:#ffd666} .sticky p{margin:2px 0 0;white-space:pre-wrap;max-height:4.2em;overflow:hidden}
.lst b{display:block;font-weight:500;font-size:11.5px;color:var(--c);margin-bottom:3px}
.lst ul{list-style:none;margin:0;padding:0} .lst li{padding:1px 0 1px 16px;position:relative;font-size:12px}
.lst li::before{content:"";position:absolute;left:0;top:6px;width:8px;height:8px;border:1px solid var(--c)}
.lst li.done{color:var(--dim);text-decoration:line-through} .lst li.done::before{background:var(--c)}
/* discord */
.dm{display:grid;grid-template-columns:1fr auto;gap:1px 8px;padding:4px 0;border-top:1px solid rgba(var(--crgb),.1)}
.dm:first-child{border-top:0}
.sk{display:grid;grid-template-columns:1fr auto 76px;gap:10px;align-items:baseline;padding:4px 0;border-top:1px solid rgba(var(--crgb),.1);font-variant-numeric:tabular-nums}
.sk:first-child{border-top:0}
.sk b{font-weight:500;font-size:12.5px;color:var(--ink)}
.sk span{font-size:12.5px;color:var(--ink)}
.sk em{font-style:normal;font-size:12px;text-align:right;color:var(--dim)}
.sk.up em{color:var(--up)}.sk.dn em{color:var(--down)}
.sk.flash-up{animation:flashUp 1s ease-out}.sk.flash-dn{animation:flashDn 1s ease-out}
.dm b{font-weight:500;font-size:11.5px;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dm em{font-style:normal;font-size:10.5px;color:var(--dim)}
.dm p{grid-column:1/-1;margin:0;font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (prefers-reduced-motion:reduce){.wd{animation:none}}

.hp{position:absolute;width:var(--w,270px);max-height:196px;overflow:hidden;color:var(--ink);
  background:linear-gradient(180deg,rgba(var(--crgb),.11),rgba(var(--vrgb),.82) 46%);
  border:1px solid rgba(var(--crgb),.38);box-shadow:0 0 34px rgba(var(--crgb),.14),inset 0 0 22px rgba(var(--crgb),.07);
  animation:hpIn .5s cubic-bezier(.2,.8,.2,1) both;transition:top .45s cubic-bezier(.2,.8,.2,1),left .45s cubic-bezier(.2,.8,.2,1),opacity .7s,filter .7s,transform .7s}
.hp::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 2px,rgba(var(--crgb),.045) 2px 3px)}
.hp::after{content:"";position:absolute;left:0;right:0;height:40%;top:0;pointer-events:none;transform:translateY(-100%);
  background:linear-gradient(180deg,transparent,rgba(var(--crgb),.10),transparent);animation:hpScan 2.6s linear infinite}
.hp.done::after{animation:none;opacity:0}
.hp.out{opacity:0;filter:blur(5px) brightness(1.6);transform:scale(.97)}
.hp.fail{border-color:rgba(var(--argb),.6)}
@keyframes hpIn{0%{opacity:0;clip-path:inset(49% 0 49% 0);filter:brightness(2.4)}55%{opacity:1;clip-path:inset(0 0 0 0)}100%{filter:none;clip-path:inset(0 0 0 0)}}
@keyframes hpScan{to{transform:translateY(250%)}}
.hp .hh{display:flex;align-items:center;gap:8px;height:25px;padding:0 10px;border-bottom:1px solid rgba(var(--crgb),.22);
  font:var(--dispw) 9.5px/1 var(--display);letter-spacing:.2em;color:var(--c);white-space:nowrap}
:root[data-ai=ultron] .hp .hh{font-size:12.5px;letter-spacing:.12em}
.hp .hh i{width:6px;height:6px;flex:none;background:var(--c);transform:rotate(45deg);animation:blink .7s steps(2) infinite}
.hp.done .hh i{animation:none} .hp.fail .hh i{background:var(--alarm)}
.hp .hh span{margin-left:auto;font:400 11px var(--text);letter-spacing:0;color:var(--dim);font-variant-numeric:tabular-nums}
.hp .bd{position:relative;padding:9px 10px 10px;font-size:12.5px;line-height:1.45}
.hp .sub{color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp .big{font:500 17px/1.25 var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hp .row{display:flex;gap:10px;align-items:center}
/* search: radar sweep */
.radar{width:78px;height:78px;flex:none}
.radar circle,.radar line{fill:none;stroke:rgba(var(--crgb),.35);stroke-width:.8}
.radar .sw{transform-origin:50px 50px;animation:spin 1.6s linear infinite}
.radar .sw path{fill:url(#rg);stroke:none}
.radar .bl{fill:var(--c);stroke:none;opacity:0;animation:blip 1.6s linear infinite}
.hp.done .radar .sw{animation-duration:4s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%,40%{opacity:0}45%{opacity:1}100%{opacity:0}}
/* terminal */
.term{font:11.5px/1.45 "Cascadia Mono",Consolas,monospace;margin:0;white-space:pre-wrap;word-break:break-all;max-height:150px;overflow:hidden;color:var(--ink)}
.term b{color:var(--c);font-weight:400}
.term .cur{display:inline-block;width:7px;height:12px;background:var(--c);vertical-align:-1px;animation:blink .8s steps(2) infinite}
/* lists */
.hl{list-style:none;font-size:12px;line-height:1.5}
.hl li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;animation:liIn .3s ease-out forwards}
.hl li::before{content:"";display:inline-block;width:4px;height:4px;margin:0 7px 2px 0;background:var(--c);transform:rotate(45deg)}
@keyframes liIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
/* launch / progress */
.seg{display:flex;gap:3px;margin-top:8px}
.seg i{flex:1;height:6px;background:rgba(var(--crgb),.14)}
.seg i{animation:segOn 1.1s steps(1) infinite}
.hp.done .seg i{animation:none;background:var(--c)}
@keyframes segOn{0%{background:rgba(var(--crgb),.14)}50%{background:var(--c)}}
/* media */
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border:1px solid rgba(var(--crgb),.25);margin-bottom:6px;max-height:112px}
.eq{display:flex;gap:3px;align-items:flex-end;height:30px;margin-top:6px}
.eq i{flex:1;background:var(--c);height:100%;transform-origin:bottom;transform:scaleY(.2);animation:eq .9s ease-in-out infinite alternate;opacity:.85}
@keyframes eq{to{transform:scaleY(1)}}
/* level */
.lvl{font:var(--dispw) 30px/1 var(--display);color:var(--c)}
.lvlbar{height:5px;background:rgba(var(--crgb),.14);margin-top:8px}.lvlbar i{display:block;height:100%;background:var(--c);transition:width .8s}
/* gauges */
.gs{display:grid;grid-template-columns:62px 1fr 34px;gap:5px 8px;align-items:center;font-size:11.5px}
.gs i{height:4px;background:rgba(var(--crgb),.14);position:relative}.gs i b{position:absolute;inset:0 auto 0 0;background:var(--c);transition:width 1s}
/* screen scan */
.shot{position:relative;min-height:80px}
.shot img{width:100%;display:block;max-height:140px;object-fit:cover;object-position:top;filter:saturate(.6) contrast(1.1)}
.shot::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--c);box-shadow:0 0 12px var(--c);top:0;animation:shotScan 1.8s ease-in-out infinite alternate}
.hp.done .shot::after{opacity:0}
@keyframes shotScan{to{top:calc(100% - 2px)}}
.shot .ph{color:var(--dim);font-size:12px;padding:24px 0;text-align:center}
/* blender cube */
.cube3{width:64px;height:64px;margin:6px auto 4px;perspective:260px}
.cube3 div{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:cube 6s linear infinite}
.cube3 span{position:absolute;inset:0;border:1px solid var(--c);background:rgba(var(--crgb),.06)}
.cube3 span:nth-child(1){transform:translateZ(32px)}.cube3 span:nth-child(2){transform:rotateY(180deg) translateZ(32px)}
.cube3 span:nth-child(3){transform:rotateY(90deg) translateZ(32px)}.cube3 span:nth-child(4){transform:rotateY(-90deg) translateZ(32px)}
.cube3 span:nth-child(5){transform:rotateX(90deg) translateZ(32px)}.cube3 span:nth-child(6){transform:rotateX(-90deg) translateZ(32px)}
@keyframes cube{to{transform:rotateX(-20deg) rotateY(360deg)}}
.cube3 div{transform:rotateX(-20deg)}
/* targeting */
.tgt{width:64px;height:64px;flex:none}
.tgt circle,.tgt line{fill:none;stroke:var(--c);stroke-width:1}
.tgt .rot{transform-origin:32px 32px;animation:spin 3s linear infinite}
/* reasoning */
.think{font-size:11.5px;line-height:1.5;color:var(--dim);max-height:140px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 30%)}
.think b{color:var(--ink);font-weight:400}
@media (prefers-reduced-motion:reduce){.hp,.hp::after{animation:none!important}}
/* briefing cards */
.wx{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.wx svg{width:46px;height:46px;grid-row:1/3;color:var(--c)}
.wx svg *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wx .t{font:var(--dispw) 28px/1 var(--display);color:var(--ink)}
:root[data-ai=ultron] .wx .t{font-size:34px}
.wx .t .u{font:400 17px var(--text);margin-left:3px;vertical-align:6px;color:var(--dim)}
.wx .l{font-size:12.5px;color:var(--dim);line-height:1.3}
.wx .r{grid-column:1/3;display:flex;gap:14px;font-size:12px;color:var(--dim);margin-top:4px}
.wx .r b{color:var(--ink);font-weight:500}
.hl.plain li::before{background:var(--dim)}
.hl li b{font-weight:500;color:var(--c);margin-right:6px}


@media (prefers-reduced-motion:reduce){.hp *{animation:none!important}}
/* ============================================================ what he pulls up (desk_pulls.js)
   One panel design, five dialects: each scene's style changes the frame, type and corners, never the content. */
@font-face{font-family:"Chakra Petch";font-weight:500;font-display:swap;src:url(fonts/chakra-petch-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-weight:600;font-display:swap;src:url(fonts/chakra-petch-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Jost";font-weight:300;font-display:swap;src:url(fonts/jost-latin-300-normal.woff2) format("woff2")}
#pulls{position:fixed;inset:0;z-index:6;pointer-events:none;font-size:calc(16px * var(--k,1));
  --ph:"Jost","Segoe UI",sans-serif;--pb:"Jost","Segoe UI",sans-serif;--pm:"Cascadia Mono",Consolas,monospace;--pr:2px}
body[data-style=sheet] #pulls{--ph:"IBM Plex Mono","Cascadia Mono",Consolas,monospace;--pr:0}
body[data-style=module] #pulls{--ph:"Chakra Petch","Bahnschrift",sans-serif;--pr:0}
body[data-style=card] #pulls{--ph:"Cormorant Garamond",Georgia,serif;--pr:.5em}
body[data-style=scope] #pulls{--ph:"Cascadia Mono",Consolas,monospace;--pb:"Cascadia Mono",Consolas,monospace;--pr:.9em}
body[data-style=legend] #pulls{--ph:"Fraunces",Georgia,serif;--pr:.25em}
body.has-pulls #holo{opacity:0}
.pl{position:absolute;box-sizing:border-box;overflow:hidden;color:var(--ink);font:400 1em/1.35 var(--pb);
  background:var(--panel);border:1px solid var(--border);border-radius:var(--pr);
  box-shadow:0 1.2em 3em rgba(0,0,0,.45),inset 0 0 0 1px rgba(var(--crgb),.06);
  transition:top .5s cubic-bezier(.2,.8,.2,1),left .5s cubic-bezier(.2,.8,.2,1),width .5s cubic-bezier(.2,.8,.2,1),opacity .25s}
.pl.in{animation:plIn .6s cubic-bezier(.2,.8,.2,1) both}
.pl.in .plb > *{animation:plRow .5s cubic-bezier(.2,.8,.2,1) both}
.pl.in .plb > *:nth-child(2){animation-delay:.08s}.pl.in .plb > *:nth-child(3){animation-delay:.16s}.pl.in .plb > *:nth-child(4){animation-delay:.24s}
.pl.out{opacity:0}
@keyframes plIn{0%{clip-path:inset(0 0 100% 0);opacity:.2;filter:brightness(2.2)}60%{clip-path:inset(0 0 0 0);opacity:1}100%{filter:none}}
@keyframes plRow{from{opacity:0;transform:translateY(.6em)}to{opacity:1;transform:none}}
.pl.in::before{content:"";position:absolute;left:0;right:0;height:2px;background:var(--c);box-shadow:0 0 1em var(--c);animation:plScan .6s ease-out both;z-index:2}
@keyframes plScan{from{top:0}to{top:100%;opacity:0}}
@media (prefers-reduced-motion:reduce){.pl,.pl *{animation:none!important;transition:none!important}.pl.in::before{display:none}}
.plh{display:flex;align-items:baseline;gap:.6em;padding:.75em 1em .6em;border-bottom:1px solid rgba(var(--crgb),.22)}
.plh .pli{width:.5em;height:.5em;background:var(--c);transform:rotate(45deg);flex:none;align-self:center}
.plh b{font:600 1.15em/1 var(--ph);letter-spacing:.02em;color:var(--ink)}
.plh .pls{margin-left:auto;font:400 .85em/1 var(--pm);color:var(--dim)}
.plh .plive{font:600 .7em/1 var(--pm);color:var(--alarm);border:1px solid var(--alarm);padding:.2em .4em;letter-spacing:.1em;text-transform:uppercase}
.plb{padding:.9em 1em 1em;display:flex;flex-direction:column;gap:.75em}
.plf{padding:0 1em .7em;font:400 .7em/1.3 var(--pm);color:var(--dim);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plf:empty{display:none}
.plc{position:absolute;width:.9em;height:.9em;border-color:var(--c);border-style:solid;border-width:0;opacity:.8}
.plc.tl{left:-1px;top:-1px;border-left-width:2px;border-top-width:2px}.plc.tr{right:-1px;top:-1px;border-right-width:2px;border-top-width:2px}
.plc.bl{left:-1px;bottom:-1px;border-left-width:2px;border-bottom-width:2px}.plc.br{right:-1px;bottom:-1px;border-right-width:2px;border-bottom-width:2px}
/* dialects */
body[data-style=sheet] .pl{background:linear-gradient(var(--panel),var(--panel)),repeating-linear-gradient(0deg,transparent 0 31px,rgba(var(--crgb),.06) 31px 32px);outline:1px solid rgba(var(--crgb),.25);outline-offset:4px}
body[data-style=sheet] .plh b{text-transform:uppercase;letter-spacing:.12em;font-size:.95em}
body[data-style=module] .pl{clip-path:polygon(0 0,calc(100% - 1.4em) 0,100% 1.4em,100% 100%,1.4em 100%,0 calc(100% - 1.4em));border-top:3px solid var(--c)}
body[data-style=module] .plh b{text-transform:uppercase;letter-spacing:.14em}
body[data-style=module] .plc{display:none}
body[data-style=card] .pl{box-shadow:0 1.4em 3em rgba(0,0,0,.6),inset 0 0 0 .35em rgba(var(--crgb),.06)}
body[data-style=card] .plh b{font-size:1.5em;font-style:italic;font-weight:600}
body[data-style=card] .plc{display:none}
body[data-style=card] .plh .pli{border-radius:50%;transform:none}
body[data-style=scope] .pl{background:radial-gradient(120% 120% at 50% 30%,rgba(var(--crgb),.07),transparent 60%),var(--panel);text-shadow:0 0 .4em rgba(var(--crgb),.35)}
body[data-style=scope] .pl::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);pointer-events:none}
body[data-style=scope] .plc{display:none}
body[data-style=legend] .pl{outline:1px solid rgba(var(--crgb),.3);outline-offset:-6px}
body[data-style=legend] .plh b{font-style:italic;font-size:1.35em}
/* focus: the scene dims, one panel takes the middle */
#scenes,#vizbox,#widgets{transition:filter .5s,opacity .5s}
body.focusing #scenes{filter:brightness(.32) saturate(.7)}
body.focusing #vizbox{opacity:.25}
body.focusing #widgets{opacity:.15}
body.focusing .pl:not(.focus){opacity:.18}
.pl.focus{font-size:1.32em;box-shadow:0 2em 6em rgba(0,0,0,.7),0 0 0 1px rgba(var(--crgb),.4),0 0 4em rgba(var(--crgb),.12)}
/* shared bits */
.pl .big{font:300 3em/1 var(--pb);letter-spacing:-.02em;color:var(--ink)}
.pl .up{color:var(--c)} .pl .dn{color:var(--alarm)}
/* stock */
.stk-name{font-size:.9em;color:var(--dim);margin-bottom:-.4em}
.stk-top{display:flex;align-items:baseline;gap:.8em;flex-wrap:wrap}
.stk-top .chg{font:500 1.05em/1 var(--pm)}
.pl svg.chart{position:static;width:100%;height:9em;display:block}
.chart .grid{stroke:rgba(var(--crgb),.1);stroke-width:1}
.chart .prev{stroke:var(--dim);stroke-dasharray:4 5;stroke-width:1;opacity:.7}
.chart .ln{fill:none;stroke-width:2.2;vector-effect:non-scaling-stroke}
.chart .ln.up{stroke:var(--c)}.chart .ln.dn{stroke:var(--alarm)}
.chart .area.up{fill:rgba(var(--crgb),.12)}.chart .area.dn{fill:rgba(var(--argb),.12)}
.chart .dot.up{fill:var(--c)}.chart .dot.dn{fill:var(--alarm)}
.pl .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.5em;border-top:1px solid rgba(var(--crgb),.15);padding-top:.6em}
.pl .stats span{display:block;font-size:.72em;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.pl .stats b{font:500 .82em/1.2 var(--pm);white-space:nowrap}
.pl .take{margin:0;font-style:italic;color:var(--ink);opacity:.9;border-left:2px solid var(--c);padding-left:.7em}
/* weather */
.wx-top{display:flex;align-items:baseline;gap:.8em}.wx-l{color:var(--dim)}
.radar{position:relative;height:13em;overflow:hidden;border:1px solid rgba(var(--crgb),.25)}
.radar .mosaic{position:absolute;left:0;width:100%;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(var(--n),1fr)}
.radar .tile{position:relative;aspect-ratio:1}.radar .tile img{position:absolute;inset:0;width:100%;height:100%;display:block}
.radar .tile img + img{opacity:.85;mix-blend-mode:screen}
.radar .you{position:absolute;width:.8em;height:.8em;margin:-.4em;border-radius:50%;background:var(--alarm);box-shadow:0 0 0 .3em rgba(var(--argb),.3)}
.hours{display:grid;grid-template-columns:repeat(12,1fr);gap:.25em;height:6.5em}
.hours .hr{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.hours .hr i{width:60%;background:rgba(var(--crgb),.35)}
.hours .hr u{position:absolute;bottom:1.3em;width:60%;background:rgba(120,180,255,.45);text-decoration:none}
.hours .hr b{font:500 .7em/1 var(--pm);margin-bottom:.2em}.hours .hr span{font:400 .65em/1.6 var(--pm);color:var(--dim)}
/* calendar */
.tline{position:relative;height:4.2em;border-bottom:1px solid rgba(var(--crgb),.3);margin-top:.4em}
.tline .tk{position:absolute;bottom:-1.4em;font:400 .7em/1 var(--pm);color:var(--dim);transform:translateX(-50%)}
.tline .blk{position:absolute;height:28%;background:rgba(var(--crgb),.45);border-left:2px solid var(--c)}
.tline .now{position:absolute;top:-.3em;bottom:-.3em;width:2px;background:var(--alarm);box-shadow:0 0 .6em var(--alarm)}
.evs{list-style:none;margin:.9em 0 0;padding:0;display:flex;flex-direction:column;gap:.35em}
.evs li{display:grid;grid-template-columns:7.5em 1fr;gap:.3em .8em;font-size:.95em}
.evs li time{font:500 .85em/1.5 var(--pm);color:var(--dim)}.evs li em{grid-column:2;font-size:.8em;color:var(--dim);font-style:normal}
.evs li.on span{color:var(--c)}.evs li.none{display:block;color:var(--dim)}
/* sources */
.pl .q{font-style:italic;color:var(--dim)}
.src{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:.45em}
.src li{font-size:.92em}.src li::marker{font:500 .85em var(--pm);color:var(--c)}
.src li b{display:block;font:500 .75em/1.3 var(--pm);color:var(--c)}
/* pc */
.pl svg.pcmap{position:static;width:100%;height:auto;display:block}
.pcmap .board{fill:rgba(var(--crgb),.04);stroke:rgba(var(--crgb),.45);stroke-width:1.5}
.pcmap .trace{fill:none;stroke:rgba(var(--crgb),.18);stroke-width:1}
.pcmap .part{fill:rgba(var(--vrgb),.7);stroke:var(--c);stroke-width:1.5}
.pcmap .die{fill:rgba(var(--crgb),.12);stroke:rgba(var(--crgb),.6)}
.pcmap .ram.full{fill:rgba(var(--crgb),.18)}.pcmap .ramfill{fill:rgba(var(--crgb),.35)}
.pcmap .blade{fill:none;stroke:rgba(var(--crgb),.6);stroke-width:1.5}
.pcmap .fan2{fill:none;stroke:rgba(var(--crgb),.4);stroke-width:1.2;stroke-dasharray:6 4}
.pcmap .drivefill{fill:rgba(var(--crgb),.3)}.pcmap .drivefill.hot{fill:rgba(var(--argb),.5)}
.pcmap .val{fill:var(--ink);font:600 20px var(--pm);text-anchor:middle}
.pcmap .cap{fill:var(--dim);font:500 13px var(--pm);text-anchor:middle;letter-spacing:.15em}
.pcmap .dl{fill:var(--ink);font:500 11px var(--pm)}
.pl.cpu-hot .pcmap .cpu{stroke:var(--alarm)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:.4em .9em}
.specs span{display:block;font-size:.7em;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}.specs b{font-weight:500;font-size:.88em}
/* file preview */
.page{background:#f4efe4;color:#222;border-radius:2px;padding:1.2em 1.4em;font:400 .72em/1.45 Georgia,serif;max-height:24em;overflow:hidden;
  box-shadow:0 .6em 2em rgba(0,0,0,.4);-webkit-mask-image:linear-gradient(#000 80%,transparent)}
.page h3{font:600 1.7em/1.1 Georgia,serif;margin:0 0 .5em}.page h4{font:600 1.15em/1.2 Georgia,serif;margin:.8em 0 .3em}
.page p{margin:0 0 .5em}.page p.qt{font-style:italic;border-left:3px solid #999;padding-left:.6em}.page ul{margin:0 0 .5em;padding-left:1.3em}
.page table{border-collapse:collapse;margin:.4em 0}.page td,.page th{border:1px solid #bbb;padding:.15em .5em;font-size:.95em}
.grid{border-collapse:collapse;width:100%;font:400 .8em/1.3 var(--pm)}
.grid th,.grid td{border:1px solid rgba(var(--crgb),.25);padding:.25em .45em;text-align:left;white-space:nowrap;overflow:hidden;max-width:9em;text-overflow:ellipsis}
.grid th{background:rgba(var(--crgb),.14);color:var(--ink)}
.grid td.fx{color:var(--dim);font-style:italic}
.sheet-name{font:500 .75em var(--pm);color:var(--dim)}
.deck{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.slide{aspect-ratio:16/9;background:#f4efe4;color:#222;padding:.6em .7em;display:flex;flex-direction:column;gap:.15em;overflow:hidden;font:400 .6em/1.3 "Segoe UI",sans-serif}
.slide b{font-size:1.35em}.slide span::before{content:"• "}
.pl pre.code{margin:0;font:400 .75em/1.45 var(--pm);color:var(--ink);white-space:pre-wrap;max-height:22em;overflow:hidden;
  background:rgba(0,0,0,.25);padding:.8em;border-left:2px solid var(--c)}
/* network */
.pl svg.netmap{position:static;width:100%;height:auto;display:block}
.netmap .orbit{fill:none;stroke:rgba(var(--crgb),.12)}
.netmap .router{fill:rgba(var(--crgb),.2);stroke:var(--c);stroke-width:1.5}
.netmap .link{stroke:rgba(var(--crgb),.25);stroke-width:1}.netmap .link.new{stroke:var(--alarm);stroke-dasharray:4 4}
.netmap .dev{fill:var(--c)}.netmap .dev.me{fill:var(--ink)}.netmap .dev.new{fill:var(--alarm)}
.netmap .dn{fill:var(--dim);font:500 11px var(--pm);text-anchor:middle}.netmap .dn.new{fill:var(--alarm)}
.netmap .cap{fill:var(--dim);font:500 12px var(--pm);text-anchor:middle;letter-spacing:.15em}
.newdev{list-style:none;margin:0;padding:0;font-size:.85em}.newdev li{display:flex;gap:.6em}.newdev li b{color:var(--alarm);font:600 .8em var(--pm);text-transform:uppercase}
.newdev li.none{color:var(--dim)}
/* briefing */
.brief{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.brief .cell{border:1px solid rgba(var(--crgb),.2);padding:.6em .7em;display:flex;flex-direction:column;gap:.15em;font-size:.88em}
.brief .cell b{font:600 .72em/1.4 var(--pm);text-transform:uppercase;letter-spacing:.1em;color:var(--c)}
.brief .cell.patch{grid-column:1/-1}.brief .cell.rec span:first-of-type{font-size:1.5em;font-weight:300}
/* tracker */
.score{display:flex;flex-direction:column;gap:.3em}
.score .team{display:flex;justify-content:space-between;align-items:baseline;font-size:1.2em}.score .team strong{font:300 1.8em/1 var(--pb)}
.score .team.win span{color:var(--c)}
.pbar{height:.5em;background:rgba(var(--crgb),.15)}.pbar i{display:block;height:100%;background:var(--c);transition:width 1s}
.pl p.tl{margin:0;color:var(--dim);font-size:.9em}
/* ============================================================ live: real green and red, flashes on every tick */
:root{--up:#2fd27a;--uprgb:47,210,122;--down:#ff4d5e;--dnrgb:255,77,94}
@keyframes flashUp{0%{background:rgba(var(--uprgb),.55);color:#fff}100%{background:transparent}}
@keyframes flashDn{0%{background:rgba(var(--dnrgb),.55);color:#fff}100%{background:transparent}}
.flash-up{animation:flashUp .9s ease-out}.flash-dn{animation:flashDn .9s ease-out}
.pl .up{color:var(--up)} .pl .dn{color:var(--down)}
.pl .px{padding:0 .12em;border-radius:.1em}
.chart .ln.up{stroke:var(--up)}.chart .ln.dn{stroke:var(--down)}
.chart .area.up{fill:rgba(var(--uprgb),.13)}.chart .area.dn{fill:rgba(var(--dnrgb),.13)}
.chart .dot.up{fill:var(--up)}.chart .dot.dn{fill:var(--down)}
.plh .plive{display:flex;align-items:center;gap:.35em;color:var(--down);border-color:var(--down)}
.plh .plive i{width:.5em;height:.5em;border-radius:50%;background:var(--down);box-shadow:0 0 .5em var(--down)}
.plh .plive i.flash-up{animation:dotPing .8s ease-out}
@keyframes dotPing{0%{box-shadow:0 0 0 0 rgba(var(--dnrgb),.9)}100%{box-shadow:0 0 0 .7em rgba(var(--dnrgb),0)}}
.pl.stale .plive{color:var(--dim);border-color:var(--dim)}.pl.stale .plive i{background:var(--dim);box-shadow:none}
.tape{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:.2em .8em;font:400 .75em/1.5 var(--pm)}
.tape li{display:flex;gap:.5em;color:var(--dim)}.tape li b{color:var(--ink);font-weight:500}
.tape li.up span{color:var(--up)}.tape li.dn span{color:var(--down)}
.tape li:first-child{animation:plRow .35s ease-out}
.radar .tile img.fr{opacity:0;transition:opacity .25s;mix-blend-mode:screen}
.radar .rstamp{position:absolute;right:.5em;bottom:.4em;font:600 .75em var(--pm);color:#fff;text-shadow:0 0 .4em #000;z-index:2}
.pcspark{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:.5em;align-items:center;font:500 .7em var(--pm);color:var(--dim)}
.pl svg.spk{position:static;width:100%;height:2.2em;display:block}
.spk .l{fill:none;stroke:var(--c);stroke-width:1.6;vector-effect:non-scaling-stroke}.spk .a{fill:rgba(var(--crgb),.15)}
.dlspark .spk{height:3em}
.pl svg.flmap{position:static;width:100%;height:auto;display:block;background:rgba(0,0,0,.25);border:1px solid rgba(var(--crgb),.25)}
.flmap .gl{stroke:rgba(var(--crgb),.1);stroke-width:1}
.flmap .trail{fill:none;stroke:var(--alarm);stroke-width:2;stroke-dasharray:4 4}
.flmap .plane{fill:var(--ink);stroke:var(--c);stroke-width:1}
.flmap .ll{fill:var(--dim);font:500 12px var(--pm)}
.fl-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em}
.fl-nums span{display:block;font-size:.7em;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}.fl-nums b{font:500 1.05em var(--pm)}
.score .team.scored{animation:flashUp 2.4s ease-out}
.pl.is-live .plh .pls{color:var(--down)}
.netmap .dev.joined{animation:dotPing 1.2s ease-out 3}


</style></head>
