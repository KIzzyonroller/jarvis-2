<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis Mini</title>
<style>
@font-face{font-family:"Michroma";font-weight:400;font-display:swap;src:url(fonts/michroma-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Jost";font-weight:400;font-display:swap;src:url(fonts/jost-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Jost";font-weight:500;font-display:swap;src:url(fonts/jost-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Big Shoulders Display";font-weight:800;font-display:swap;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-weight:500;font-display:swap;src:url(fonts/chakra-petch-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Chakra Petch";font-weight:600;font-display:swap;src:url(fonts/chakra-petch-latin-600-normal.woff2) format("woff2")}
:root{
  --void:#02060b; --c:#7fe7ff; --crgb:127,231,255; --ink:#dff6ff; --dim:#5f7f8f; --alarm:#ff9d2e; --argb:255,157,46;
  --display:"Michroma",sans-serif; --dispw:400; --dsize:9.5px; --dtrack:.16em; --text:"Jost","Segoe UI",sans-serif; --textw:400;
}
:root[data-ai="ultron"]{
  --void:#080203; --c:#ff3046; --crgb:255,48,70; --ink:#f4e9e4; --dim:#86636a; --alarm:#ffd34d; --argb:255,211,77;
  --display:"Big Shoulders Display",sans-serif; --dispw:800; --dsize:14px; --dtrack:.14em; --text:"Chakra Petch","Segoe UI",sans-serif; --textw:500;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--void);color:var(--ink);font:var(--textw) 13px/1.3 var(--text);
  user-select:none;-webkit-user-select:none;cursor:default}
body{position:relative}
.frame{position:absolute;inset:0;border:1px solid rgba(var(--crgb),.28);pointer-events:none}
.frame::before{content:"";position:absolute;left:-1px;top:-1px;width:30px;height:2px;background:var(--c);box-shadow:0 0 10px var(--c)}
body.st-awaiting .frame{border-color:rgba(var(--argb),.7)} body.st-awaiting .frame::before{background:var(--alarm);box-shadow:0 0 10px var(--alarm)}
.wrap{position:absolute;inset:0;display:grid;grid-template-columns:92px 1fr;grid-template-rows:108px auto;align-content:start}
.reactor{grid-row:1;position:relative;display:grid;place-items:center}
canvas{width:84px;height:84px;display:block}
.info{grid-row:1;min-width:0;padding:11px 12px 9px 2px;display:flex;flex-direction:column;gap:5px}
.top{display:flex;align-items:center;gap:8px;min-width:0}
.wm{font:var(--dispw) var(--dsize)/1 var(--display);letter-spacing:var(--dtrack);color:var(--c);white-space:nowrap}
.st{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.st::before{content:"";display:inline-block;width:5px;height:5px;margin:0 6px 1px 0;background:var(--dim);transform:rotate(45deg);vertical-align:middle}
body.st-speaking .st,body.st-listening .st,body.st-thinking .st{color:var(--c)}
body.st-speaking .st::before,body.st-listening .st::before,body.st-thinking .st::before{background:var(--c)}
body.st-thinking .st::before{animation:blink .8s steps(2) infinite}
body.st-awaiting .st{color:var(--alarm)} body.st-awaiting .st::before{background:var(--alarm);animation:blink .5s steps(2) infinite}
body.muted .st{color:var(--alarm)}
@keyframes blink{50%{opacity:.2}}
.btns{display:flex;gap:3px;flex:none}
.b{width:22px;height:22px;display:grid;place-items:center;border:1px solid rgba(var(--crgb),.2);background:transparent;color:var(--ink);
  cursor:pointer;transition:border-color .12s,background .12s}
.b:hover{border-color:var(--c);background:rgba(var(--crgb),.12)}
.b svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:square}
.b.stop{display:none} body.st-speaking .b.stop,body.st-thinking .b.stop{display:grid}
body.muted .b.mic{border-color:var(--alarm);color:var(--alarm)}
.b.mic .off{display:none} body.muted .b.mic .on{display:none} body.muted .b.mic .off{display:block}
.cap{font-size:13.5px;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;min-height:35px;transition:opacity .6s}
.cap.fade{opacity:.35}
.act{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:15px;opacity:0;transition:opacity .2s}
.act.on{opacity:1}
.act b{font-weight:500;color:var(--c);margin-right:6px}
/* approval */
.confirm{grid-column:1/-1;grid-row:2;margin:0 10px 10px;padding:9px 10px 10px;background:rgba(var(--argb),.06);
  border:1px solid rgba(var(--argb),.6);display:none;flex-direction:column;gap:5px;position:relative;overflow:hidden}
body.confirming .confirm{display:flex}
.confirm>*{flex:none}
.ct{font:var(--dispw) var(--dsize)/14px var(--display);letter-spacing:var(--dtrack);color:var(--alarm)}
.cd{font-size:13px;font-weight:500;line-height:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cx{line-height:15px;font:11px/15px Consolas,"Cascadia Mono",monospace;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{display:flex;gap:5px;margin-top:3px}
.cb button{flex:1;height:28px;font:inherit;font-size:12.5px;cursor:pointer;border:1px solid rgba(var(--crgb),.3);background:transparent;color:var(--ink)}
.cb button:hover{background:rgba(var(--crgb),.12)}
.cb .alw{flex:1.3;border-color:rgba(var(--argb),.5);color:var(--alarm)} .cb .alw:hover{background:rgba(var(--argb),.12)}
.cb .yes{background:var(--alarm);border-color:var(--alarm);color:#140a00;font-weight:600} .cb .yes:hover{filter:brightness(1.1)}
.timer{position:absolute;left:0;bottom:0;height:2px;background:var(--alarm);width:100%;transform-origin:left}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="st-idle">
<div class="wrap" id="drag">
  <div class="reactor" title="Double-click to open"><canvas id="cv" width="126" height="126"></canvas></div>
  <div class="info">
    <div class="top">
      <span class="wm" id="wm">J.A.R.V.I.S.</span>
      <span class="st" id="st">Standby</span>
      <span class="btns">
        <button class="b stop" id="b-stop" title="Stop"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7"/></svg></button>
        <button class="b mic" id="b-mic" title="Mute mic"><svg viewBox="0 0 12 12"><g class="on"><rect x="4" y="1" width="4" height="6.5" rx="2"/><path d="M2.2 6a3.8 3.8 0 0 0 7.6 0M6 9.8V11.4"/></g><g class="off"><rect x="4" y="1" width="4" height="6.5" rx="2"/><path d="M2.2 6a3.8 3.8 0 0 0 7.6 0M6 9.8V11.4M1 1l10 10"/></g></svg></button>
        <button class="b" id="b-exp" title="Open the full HUD"><svg viewBox="0 0 12 12"><path d="M7 1.5h3.5V5M10.5 1.5 6.5 5.5M5 10.5H1.5V7M1.5 10.5l4-4"/></svg></button>
      </span>
    </div>
    <div class="cap" id="cap"></div>
    <div class="act" id="act"></div>
  </div>
  <div class="confirm" id="confirm">
    <div class="ct">Needs your OK</div>
    <div class="cd" id="c-title"></div>
    <div class="cx" id="c-detail"></div>
    <div class="cb"><button class="no" id="c-no">Deny</button><button class="alw" id="c-always" hidden>Always allow</button><button class="yes" id="c-yes">Allow</button></div>
    <div class="timer" id="c-timer"></div>
  </div>
</div>
<div class="frame"></div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const api = () => (window.pywebview && window.pywebview.api) || null;
const call = (name, ...a) => { const x = api(); if (x && x[name]) x[name](...a); };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const LABEL = { booting: "Initializing", idle: "Standby", listening: "Listening", transcribing: "Processing",
  dictating: "Dictating", thinking: "Thinking", speaking: "Speaking", awaiting: "Your call" };
const STEP = { web_search: "Searching", look_at_screen: "Looking", look_at_camera: "Looking at you", run_command: "PowerShell",
  open_app: "Opening", close_app: "Closing", open_url: "Opening", open_path: "Opening", open_settings: "Settings",
  window_control: "Windows", keyboard_input: "Typing", clipboard: "Clipboard", screenshot: "Screenshot", media_control: "Media",
  set_volume: "Volume", brightness: "Brightness", system_status: "System", network_info: "Network", find_files: "Finding",
  read_file: "Reading", write_file: "Writing", move_file: "Moving", copy_file: "Copying", delete_file: "Deleting",
  set_reminder: "Reminder", remember: "Remembering", mouse: "Mouse", start_dictation: "Dictation", blender: "Blender", open: "Opening", screen: "Looking", files: "Files",
  memory: "Memory", reminders: "Reminder", display: "Display", system_info: "System", self_control: "Myself" };
const stepName = (n) => STEP[n] || n.replace(/_/g, " ");

let state = "idle", ai = "jarvis", muted = false, visible = false;
let voice = 0, mic = 0, energy = 0, lastEvent = performance.now();

// ---------------------------------------------------------------- events from Python
function setState(s) {
  state = s;
  document.body.className = document.body.className.replace(/\bst-\S+/g, "").trim() + " st-" + s;
  $("#st").textContent = muted && (s === "idle" || s === "listening") ? "Mic off" : (LABEL[s] || s);
  if (s === "idle") { setTimeout(() => { if (state === "idle") $("#cap").classList.add("fade"); }, 5000); act(null); }
  if (s === "speaking" || s === "listening") $("#cap").classList.remove("fade");
  wake();
}
let actTimer;
function act(html) {
  clearTimeout(actTimer);
  const a = $("#act");
  if (html == null) { a.classList.remove("on"); return; }
  a.innerHTML = html; a.classList.add("on");
}
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let confirmId = null, confirmT0 = 0, confirmSecs = 45;
function showConfirm(e) {
  confirmId = e.id; confirmT0 = performance.now(); confirmSecs = e.timeout || 45;
  $("#c-title").textContent = e.title || "";
  $("#c-detail").textContent = e.detail || "";
  $("#c-always").hidden = !e.can_always; $("#c-always").title = e.always_label ? "Stop asking about " + e.always_label : "";
  document.body.classList.add("confirming");
  const t = $("#c-timer"); t.style.transition = "none"; t.style.transform = "scaleX(1)";
  requestAnimationFrame(() => { t.style.transition = `transform ${confirmSecs}s linear`; t.style.transform = "scaleX(0)"; });
}
function hideConfirm() { confirmId = null; document.body.classList.remove("confirming"); }

let venv = null;
function envLevel(now) {
  if (!venv) return null;
  const p = (now - venv.start) / venv.step;
  if (p < 0) return 0;
  const i = Math.floor(p);
  if (i >= venv.env.length - 1) { if (i > venv.env.length + 5) venv = null; return 0; }
  return venv.env[i] + (venv.env[i + 1] - venv.env[i]) * (p - i);
}
window.J = {
  batch(list) { for (const e of list) { try { this.on(e); } catch (err) { console.error(err); } } },
  on(e) {
    lastEvent = performance.now();
    switch (e.type) {
      case "sync": (e.events || []).forEach((x) => window.J.on(x)); break;
      case "window": visible = !!e.visible; if (visible) wake(); break;
      case "persona":
        ai = e.key === "ultron" ? "ultron" : "jarvis";
        document.documentElement.dataset.ai = ai;
        $("#wm").textContent = e.wordmark || (ai === "ultron" ? "U.L.T.R.O.N." : "J.A.R.V.I.S.");
        break;
      case "state": setState(e.state); break;
      case "mic": muted = !!e.muted; document.body.classList.toggle("muted", muted);
        $("#b-mic").title = muted ? "Unmute mic" : "Mute mic"; setState(state); break;
      case "caption": { const c = $("#cap"); c.textContent = e.text; c.classList.remove("fade"); break; }
      case "dictation": if (e.on) act("<b>Dictating</b>" + esc(e.window || "")); else act(null); break;
      case "turn_start": act("<b>Thinking</b>"); break;
      case "turn_end": actTimer = setTimeout(() => act(null), 1500); break;
      case "activity":
        if (e.kind === "thinking_start") act("<b>Thinking</b>");
        else if (e.kind === "tool_pending") act(`<b>${esc(stepName(e.name))}</b>`);
        else if (e.kind === "tool_start") act(`<b>${esc(stepName(e.name))}</b>${esc(e.detail || "")}`);
        break;
      case "confirm": showConfirm(e); break;
      case "confirm_done": if (!e.id || e.id === confirmId) hideConfirm(); break;
      case "voice": if (!venv) voice = e.v || 0; wake(); break;
      case "voice_env":
        venv = e.env && e.env.length ? { env: e.env, step: (e.step || .02) * 1000, start: performance.now() + (e.delay || 0) * 1000 } : null;
        if (!venv) voice = 0;
        wake(); break;
      case "level": mic = e.v || 0; break;
    }
  },
};

// ---------------------------------------------------------------- buttons
$("#b-exp").onclick = () => call("expand");
$("#b-mic").onclick = () => call("toggle_mute");
$("#b-stop").onclick = () => call("stop");
$("#c-yes").onclick = () => { if (confirmId) call("confirm", confirmId, true); };
$("#c-no").onclick = () => { if (confirmId) call("confirm", confirmId, false); };
$("#c-always").onclick = () => { if (confirmId) call("confirm", confirmId, true, true); };
$("#drag").addEventListener("dblclick", (ev) => { if (!ev.target.closest("button,.confirm")) call("expand"); });
// Dragging: our own, because pywebview's version moves the window in a way that can activate it
// (steal focus). Python moves it with SWP_NOACTIVATE instead.
let drag = null, dragRaf = 0;
const pad = $("#drag");
pad.addEventListener("pointerdown", (ev) => {
  if (ev.button !== 0 || ev.target.closest("button")) return;
  drag = { x: ev.screenX, y: ev.screenY, dx: 0, dy: 0 };
  try { pad.setPointerCapture(ev.pointerId); } catch (_) {}
  call("drag_start");
});
pad.addEventListener("pointermove", (ev) => {
  if (!drag) return;
  const r = window.devicePixelRatio || 1;
  drag.dx = Math.round((ev.screenX - drag.x) * r); drag.dy = Math.round((ev.screenY - drag.y) * r);
  if (!dragRaf) dragRaf = requestAnimationFrame(() => { dragRaf = 0; if (drag) call("drag_to", drag.dx, drag.dy); });
});
const endDrag = () => { if (drag) { drag = null; call("drag_end"); } };
pad.addEventListener("pointerup", endDrag);
pad.addEventListener("pointercancel", endDrag);

// ---------------------------------------------------------------- reactor
const cv = $("#cv"), ctx = cv.getContext("2d");
const DPR = Math.min(1.5, window.devicePixelRatio || 1), SIZE = 84;
cv.width = cv.height = Math.round(SIZE * DPR);
const C = SIZE / 2;
const COL = { jarvis: { c: [127, 231, 255], hot: [223, 246, 255], alarm: [255, 157, 46], dim: [95, 127, 143] },
              ultron: { c: [255, 48, 70], deep: [110, 10, 24], hot: [255, 138, 61], bone: [244, 233, 228], alarm: [255, 211, 77], dim: [134, 99, 106] } };
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${Math.max(0, Math.min(1, a)).toFixed(3)})`;
const mixc = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
function rot(p, ax, ay, ax2) {
  let [x, y, z] = p, c = Math.cos(ax), s = Math.sin(ax);
  [y, z] = [y * c - z * s, y * s + z * c]; c = Math.cos(ay); s = Math.sin(ay); [x, z] = [x * c + z * s, -x * s + z * c];
  c = Math.cos(ax2); s = Math.sin(ax2); [y, z] = [y * c - z * s, y * s + z * c]; return [x, y, z];
}
const RINGS = Array.from({ length: 5 }, (_, i) => ({ tilt: i / 5 * Math.PI + .2, phi: i * .9, w: (i % 2 ? 1 : -1) * (.2 + .06 * i) }));
const SHARDS = (() => { const n = 12, out = []; let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) { const y = 1 - (i + .5) / n * 2, r = Math.sqrt(1 - y * y), a = i * 2.39996;
    out.push({ d: [Math.cos(a) * r, y * .85, Math.sin(a) * r], len: .62 + .4 * rnd(), w: .1 + .05 * rnd(), ph: rnd() * 6.28 }); } return out; })();
let raf = 0, lastDraw = 0, t = 0, spin = 0, alarmK = 0;
function wake() { if (!raf && visible) raf = requestAnimationFrame(frame); }
function fps() {
  if (!visible) return 0;
  if (state === "speaking" || state === "thinking" || state === "awaiting" || venv) return 40;
  if (state === "listening" || state === "dictating") return 30;
  return performance.now() - lastEvent > 8000 ? 15 : 24;
}
function frame(now) {
  raf = 0;
  const f = fps();
  if (!f) return;
  if (now - lastDraw >= 1000 / f - 2) { const dt = Math.min(0.1, (now - lastDraw) / 1000); lastDraw = now; draw(dt); }
  raf = requestAnimationFrame(frame);
}
const SPD = { idle: .35, listening: .55, transcribing: 1.1, thinking: 2.4, speaking: .8, awaiting: .25, dictating: .5 };
function draw(dt) {
  t += dt * (reduced ? 0.2 : 1); spin += dt * (SPD[state] || .4);
  const el = envLevel(performance.now());
  if (el != null) voice = el;
  const target = state === "speaking" ? Math.min(1, voice * 2.2) : (state === "listening" || state === "dictating") ? Math.min(1, mic * 3) : 0;
  energy += (target - energy) * Math.min(1, dt * (target > energy ? 30 : 10));
  alarmK += ((state === "awaiting" ? 1 : 0) - alarmK) * Math.min(1, dt * 6);
  const P = COL[ai], dimK = muted && state !== "speaking" && state !== "thinking" ? .7 : 0;
  const col = mixc(mixc(P.c, P.alarm, alarmK), P.dim, dimK), R = 26;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, SIZE, SIZE); ctx.translate(C, C);
  let g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 1.3);
  g.addColorStop(0, rgba(ai === "ultron" ? col : P.hot, ai === "ultron" ? .35 + .3 * energy : .85)); g.addColorStop(.2, rgba(col, .4)); g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R * 1.3, 0, 6.29); ctx.fill();
  if (ai === "ultron") {
    const list = SHARDS.map((sh) => ({ d: rot(sh.d, 0, spin * .6, .38), L: R * (sh.len + energy * .6 * Math.pow(.5 + .5 * Math.sin(t * 11 + sh.ph * 3), 2)), w: sh.w * R }))
      .sort((p, q) => q.d[2] - p.d[2]);
    for (const s of list) {
      const [dx, dy, dz] = s.d, k = 3.2 / (3.2 + dz), bx = dx * R * .2, by = dy * R * .2, tx = dx * s.L * k, ty = dy * s.L * k;
      const vx = tx - bx, vy = ty - by, len = Math.hypot(vx, vy) || 1, px = -vy / len * s.w, py = vx / len * s.w, front = dz <= 0;
      ctx.fillStyle = rgba(front ? col : P.deep, front ? .9 : .6); ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + vx * .3 + px, by + vy * .3 + py);
      ctx.lineTo(tx, ty); ctx.lineTo(bx + vx * .3 - px, by + vy * .3 - py); ctx.closePath(); ctx.fill();
      if (front) { ctx.lineWidth = .8; ctx.strokeStyle = rgba(P.bone, .3); ctx.stroke(); }
    }
    ctx.fillStyle = "rgba(14,2,4,.95)"; ctx.beginPath(); ctx.arc(0, 0, R * .26, 0, 6.29); ctx.fill();
    ctx.fillStyle = rgba([255, 236, 220], .9); ctx.beginPath(); ctx.ellipse(0, 0, R * .3, Math.max(.8, R * (.03 + .08 * energy)), 0, 0, 6.29); ctx.fill();
  } else {
    RINGS.forEach((rg, i) => {
      const back = new Path2D(), fr = new Path2D(); let prev = null;
      for (let k = 0; k <= 48; k++) {
        const u = k / 48 * 6.2832, [x, y, z] = rot([Math.cos(u), Math.sin(u), 0], rg.tilt, rg.phi + spin * rg.w * 3, .32), s = 3.2 / (3.2 + z), rr = R * (1 + .05 * energy);
        const sx = x * rr * s, sy = y * rr * s, path = z > 0 ? back : fr;
        if (prev && prev.f === (z <= 0)) path.lineTo(sx, sy); else { if (prev) { path.moveTo(prev.x, prev.y); path.lineTo(sx, sy); } else path.moveTo(sx, sy); }
        prev = { x: sx, y: sy, f: z <= 0 };
      }
      ctx.lineWidth = .8; ctx.strokeStyle = rgba(col, .22); ctx.stroke(back);
      ctx.lineWidth = 1.2; ctx.strokeStyle = rgba(col, .85); ctx.stroke(fr);
    });
  }
  ctx.lineWidth = 1; ctx.strokeStyle = rgba(col, .45); ctx.beginPath();
  for (let i = 0; i < 48; i++) { const a = i / 48 * 6.2832 + spin * .25, l = (i % 8 ? 2 : 4) + (state === "speaking" ? energy * 6 * (.5 + .5 * Math.sin(t * 9 + i * 1.7)) : 0);
    ctx.moveTo(Math.cos(a) * 36, Math.sin(a) * 36); ctx.lineTo(Math.cos(a) * (36 + l), Math.sin(a) * (36 + l)); }
  ctx.stroke();
}

// ---------------------------------------------------------------- boot
function boot() { const x = api(); if (x && x.ready) x.ready(); }
window.addEventListener("pywebviewready", boot);
if (window.pywebview && window.pywebview.api) boot();

// demo mode for screenshots: mini.html?state=thinking&ultron&confirm&cap=...
(function demo() {
  const q = new URLSearchParams(location.search);
  if (!q.has("demo")) return;
  visible = true;
  if (q.has("ultron")) window.J.on({ type: "persona", key: "ultron", wordmark: "U.L.T.R.O.N." });
  if (q.has("muted")) window.J.on({ type: "mic", muted: true });
  window.J.on({ type: "caption", text: q.get("cap") || "Spotify's open behind your game. Want me to put something on?" });
  window.J.on({ type: "state", state: q.get("state") || "speaking" });
  if (q.get("state") === "thinking") window.J.on({ type: "activity", kind: "tool_start", name: "open_app", detail: "spotify" });
  if (q.has("confirm")) window.J.on({ type: "confirm", id: "x", title: "Run a PowerShell command", detail: "winget install --id Discord.Discord", timeout: 45, can_always: true, always_label: "PowerShell commands" });
  if (q.has("voice")) setInterval(() => window.J.on({ type: "voice_env", step: .02, delay: 0,
    env: Array.from({ length: 150 }, (_, i) => Math.max(0, Math.sin(i / 7) * .5 + Math.random() * .2)) }), 3000);
})();
</script>
</body>
</html>
