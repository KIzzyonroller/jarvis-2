<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jarvis Companion</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07080b;user-select:none;-webkit-user-select:none;cursor:grab}
body:active{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c" aria-label="Ultron, desktop form"></canvas>
<script>
// She's drawn from the app's own Ultron look: faceted red crystal, the dark band with the glowing slit,
// shards that move with his voice, and the broken polygon halo.
const cv = document.getElementById("c"), g = cv.getContext("2d");
const BW = 150, BH = 190, TAU = Math.PI * 2;
let DPR = 1;
function size() { DPR = Math.min(devicePixelRatio || 1, 2); cv.width = innerWidth * DPR; cv.height = innerHeight * DPR; g.setTransform(DPR * innerWidth / BW, 0, 0, DPR * innerHeight / BH, 0, 0); }
addEventListener("resize", size); size();
const C = { red: [255, 48, 70], hot: [255, 138, 61], deep: [110, 10, 24], bone: [244, 233, 228], dim: [134, 99, 106] };
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${Math.max(0, Math.min(1, a)).toFixed(3)})`;
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

let state = "idle", persona = "ultron", duo = false, visible = true, voice = 0, voiceAt = 0, mic = 0;
const S = { listen: 0, think: 0, speak: 0, mine: 1, v: 0, blink: 0, nextBlink: 3, halo: 0, tilt: 0, look: 0, lookT: 0 };
const HEAD = [[75, 33], [95, 42], [101, 63], [95, 86], [79, 105], [66, 99], [55, 78], [55, 52]];
const CORE = [80, 66];
const HAIR = Array.from({ length: 8 }, (_, i) => ({ a: [66 + i * 4.6, 35 + i * 2.4], len: 58 + (i % 3) * 14 + i * 3, ang: .55 + i * .11, w: 4.2 - i * .25, ph: i * 1.7 }));
const SPARKS = Array.from({ length: 10 }, (_, i) => ({ a: i / 10 * TAU, r: 52 + (i % 3) * 5, sp: .8 + (i % 4) * .3 }));

function frame(now) {
  const t = now / 1000, dt = Math.min(.1, (now - (frame.last || now)) / 1000) || .016; frame.last = now;
  const k = 1 - Math.exp(-dt * 5);
  S.listen += ((state === "listening" ? 1 : 0) - S.listen) * k;
  S.think += ((state === "thinking" || state === "transcribing" ? 1 : 0) - S.think) * k;
  S.speak += ((state === "speaking" ? 1 : 0) - S.speak) * k;
  S.mine += ((persona === "ultron" || duo ? 1 : 0) - S.mine) * k;               // when Jarvis has the floor she just watches
  if (performance.now() - voiceAt > 200) voice *= .8;
  S.v += ((persona === "ultron" || duo ? voice : 0) - S.v) * (1 - Math.exp(-dt * (voice > S.v ? 30 : 9)));
  S.halo += dt * (.12 + S.think * 1.4 + S.speak * .3);
  S.tilt += ((S.listen * .06 - S.think * .03 + Math.sin(t * .4) * .02) - S.tilt) * k;
  if (t > S.lookT) { S.lookT = t + 2.5 + Math.random() * 4; S.lookTo = (Math.random() - .5) * 6; }
  S.look += ((S.lookTo || 0) - S.look) * (1 - Math.exp(-dt * 3));
  if (t > S.nextBlink) { S.blink = 1; S.nextBlink = t + 3 + Math.random() * 4.5; }
  S.blink = Math.max(0, S.blink - dt * 8);
  const v = S.v, A = .55 + .45 * S.mine;

  g.clearRect(0, 0, BW, BH);
  g.save(); g.globalAlpha = A;
  // a low red glow she stands in
  let gr = g.createRadialGradient(75, 172, 4, 75, 172, 80);
  gr.addColorStop(0, rgba(C.red, .18 + .2 * v)); gr.addColorStop(1, rgba(C.red, 0));
  g.fillStyle = gr; g.fillRect(0, 90, BW, 100);

  // the broken halo
  const hr = 50 + v * 4, n = 9;
  g.lineWidth = 1.3; g.strokeStyle = rgba(C.red, .32 + .3 * S.listen + .2 * S.think);
  g.beginPath();
  for (let i = 0; i < n; i++) {
    const a0 = S.halo + i / n * TAU, a1 = S.halo + (i + 1) / n * TAU, p0 = [75 + Math.cos(a0) * hr, 68 + Math.sin(a0) * hr], p1 = [75 + Math.cos(a1) * hr, 68 + Math.sin(a1) * hr];
    g.moveTo(p0[0], p0[1]); g.lineTo(p0[0] + (p1[0] - p0[0]) * .68, p0[1] + (p1[1] - p0[1]) * .68);
  }
  g.stroke();
  if (S.think > .05) SPARKS.forEach((s) => { const a = s.a + t * s.sp * 2.2; g.fillStyle = rgba(C.hot, .8 * S.think); g.fillRect(75 + Math.cos(a) * s.r - 1, 68 + Math.sin(a) * s.r - 1, 2, 2); });

  g.translate(75, 100); g.rotate(S.tilt); g.translate(-75, -100);
  // shoulders and neck (drawn first, the head sits over them)
  const plate = (pts, light) => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
    const lg = g.createLinearGradient(pts[0][0], pts[0][1], pts[2][0], pts[2][1]); lg.addColorStop(0, rgba(C.deep, .95)); lg.addColorStop(1, rgba(light ? C.red : C.deep, light ? .55 : .9));
    g.fillStyle = lg; g.fill(); g.lineWidth = 1; g.strokeStyle = rgba(C.bone, .16); g.stroke(); };
  plate([[67, 101], [84, 101], [87, 142], [63, 142]], false);
  plate([[63, 140], [22, 154], [12, 192], [70, 192]], true);
  plate([[87, 140], [128, 153], [140, 192], [80, 192]], false);
  g.beginPath(); g.moveTo(75, 150); g.lineTo(81, 160); g.lineTo(75, 171); g.lineTo(69, 160); g.closePath();
  g.fillStyle = rgba(mix(C.red, C.hot, v), .55 + .45 * v); g.fill();

  // hair: long shards swept back, rippling as he talks
  HAIR.forEach((h, i) => {
    const ang = h.ang + Math.sin(t * 1.3 + h.ph) * .03 + v * .16 * Math.sin(t * 9 + h.ph) + S.think * .04 * Math.sin(t * 5 + i);
    const tip = [h.a[0] + Math.cos(ang) * h.len, h.a[1] + Math.sin(ang) * h.len], nx = -Math.sin(ang) * h.w, ny = Math.cos(ang) * h.w;
    const mid = [h.a[0] + Math.cos(ang) * h.len * .3, h.a[1] + Math.sin(ang) * h.len * .3];
    const lg = g.createLinearGradient(h.a[0], h.a[1], tip[0], tip[1]); lg.addColorStop(0, rgba(C.deep, .95)); lg.addColorStop(1, rgba(i % 2 ? C.red : C.hot, .75));
    g.fillStyle = lg; g.beginPath(); g.moveTo(h.a[0], h.a[1]); g.lineTo(mid[0] + nx, mid[1] + ny); g.lineTo(tip[0], tip[1]); g.lineTo(mid[0] - nx, mid[1] - ny); g.closePath(); g.fill();
  });

  // the head: faceted crystal, lit from the upper left
  for (let i = 0; i < HEAD.length; i++) {
    const a = HEAD[i], b = HEAD[(i + 1) % HEAD.length], lit = .35 + .5 * Math.max(0, Math.cos(Math.atan2((a[1] + b[1]) / 2 - CORE[1], (a[0] + b[0]) / 2 - CORE[0]) + 2.4));
    g.beginPath(); g.moveTo(CORE[0], CORE[1]); g.lineTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.closePath();
    g.fillStyle = rgba(mix(C.deep, C.red, lit * .7), .97); g.fill();
    g.lineWidth = .8; g.strokeStyle = rgba(C.bone, .12 + .1 * lit); g.stroke();
  }
  g.beginPath(); HEAD.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
  g.lineWidth = 1.2; g.strokeStyle = rgba(C.red, .65 + .3 * v); g.stroke();

  // the dark band and the slit: opens when he talks, wider when listening, blinks now and then
  const ey = 66, ex = 77 + S.look;
  g.fillStyle = "rgba(12,2,4,.97)"; g.beginPath(); g.moveTo(57, ey - 4); g.lineTo(99, ey - 6); g.lineTo(100, ey + 3); g.lineTo(56, ey + 5); g.closePath(); g.fill();
  const open = (1 - S.blink) * (1.1 + 4.2 * v + 1.4 * S.listen + .6 * S.think * (1 + Math.sin(t * 8)) - .5 * (1 - S.mine));
  gr = g.createRadialGradient(ex, ey, 0, ex, ey, 18);
  gr.addColorStop(0, rgba(mix(C.hot, C.bone, .3), .55 + .4 * v)); gr.addColorStop(1, rgba(C.hot, 0));
  g.fillStyle = gr; g.beginPath(); g.ellipse(ex, ey, 18, 4 + open * 1.6, -.04, 0, TAU); g.fill();
  g.fillStyle = rgba([255, 236, 220], .92); g.beginPath(); g.ellipse(ex, ey, 12, Math.max(.4, open), -.04, 0, TAU); g.fill();
  // listening: your voice ripples on her halo
  if (S.listen > .05 && mic > .02) { g.lineWidth = 1; g.strokeStyle = rgba(C.red, S.listen * mic * 1.4); g.beginPath(); g.arc(75, 68, 56 + mic * 10, 0, TAU); g.stroke(); }
  g.restore();
  schedule();
}
let timer = 0, raf = 0;
function schedule() {
  clearTimeout(timer); raf = 0;
  if (!visible || document.hidden) return;
  const busy = state === "speaking" || state === "listening" || state === "thinking" || state === "transcribing" || voice > .02 || S.blink > 0;
  timer = setTimeout(() => { raf = requestAnimationFrame(frame); }, busy ? 30 : 160);     // ~30 fps busy, ~6 idle
}
function kick() { if (!raf && visible) { clearTimeout(timer); raf = requestAnimationFrame(frame); } }
document.addEventListener("visibilitychange", kick);

function on(e) {
  if (e.type === "sync") { (e.events || []).forEach(on); return; }
  if (e.type === "state") state = e.state;
  else if (e.type === "persona") persona = e.key === "ultron" ? "ultron" : "jarvis";
  else if (e.type === "duo") duo = !!e.on;
  else if (e.type === "voice") { voice = Math.max(voice, +e.v || 0); voiceAt = performance.now(); }
  else if (e.type === "level") mic = +e.v || 0;
  else if (e.type === "window") { visible = !!e.visible; if (!visible) { clearTimeout(timer); return; } }
  kick();
}
window.J = { on };

// drag her anywhere; double-click tucks her away until he next talks
let drag = null;
addEventListener("pointerdown", (e) => { if (e.button !== 0) return; drag = { x: e.screenX, y: e.screenY, moved: false }; api("drag_start"); });
addEventListener("pointermove", (e) => { if (!drag) return; const dx = e.screenX - drag.x, dy = e.screenY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true; if (drag.moved) api("drag_to", dx * devicePixelRatio, dy * devicePixelRatio); });
addEventListener("pointerup", () => { if (drag) api("drag_end"); drag = null; });
addEventListener("dblclick", () => api("tuck"));
addEventListener("contextmenu", (e) => e.preventDefault());
function api(name, ...a) { try { window.pywebview && window.pywebview.api[name](...a); } catch (e) {} }
window.addEventListener("pywebviewready", () => api("ready"));
// demo (opened in a normal browser): cycle through her moods
if (location.search.includes("demo")) {
  const q = new URLSearchParams(location.search);
  if (q.get("state")) { state = q.get("state"); if (state === "speaking") setInterval(() => on({ type: "voice", v: .3 + .6 * Math.random() }), 60); if (q.get("persona")) persona = q.get("persona"); }
}
kick();
</script>
</body>
</html>
