# Publishes the website (the site/ folder) to GitHub Pages whenever it changes on main.
# Separate from release.yml on purpose: the site and the app ship independently.
#
# One-time setup on GitHub: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
# The site then lives at https://kizzyonroller.github.io/jarvis-2/
name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
