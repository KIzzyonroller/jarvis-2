# Builds the installer on GitHub's Windows machines and publishes it as a release.
# Every installed copy of Jarvis checks this repo's releases and updates itself.
#
# Release a new version either way:
#   * push a tag:   git tag v1.0.1  then  git push origin v1.0.1
#   * or on GitHub: Actions > Release > Run workflow, type the version.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 1.0.1 (higher than the last one)"
        required: true

permissions:
  contents: write          # to create the release and upload the installer

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Work out the version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = $env:INPUT_VERSION
          if (-not $v) { $v = $env:REF_NAME.TrimStart("v") }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Version must look like 1.2.3, got '$v'" }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      # Optional code signing with Azure Artifact Signing (see RELEASING.md). Skipped when the secrets aren't set.
      - name: Signing setup
        if: env.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          @{ Endpoint = "${{ secrets.AZURE_SIGN_ENDPOINT }}"; CodeSigningAccountName = "${{ secrets.AZURE_SIGN_ACCOUNT }}";
             CertificateProfileName = "${{ secrets.AZURE_SIGN_PROFILE }}" } | ConvertTo-Json | Set-Content sign.json
          "SIGN_FILE=sign.json" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Releases go to this repo, or (to keep your code private) to a separate public repo named in the
      # RELEASES_REPO variable, using a token stored as the RELEASES_TOKEN secret. See RELEASING.md.
      - name: Build and publish
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          ./build.ps1 -Version $env:APP_VERSION -UpdateSource "$env:SERVER_URL/$env:RELEASES_REPO" `
                      -Publish -SkipInstall -SignFile "$env:SIGN_FILE"

      - name: Keep the build log files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            Releases/*.exe
            build/Jarvis/warn-Jarvis.txt
          if-no-files-found: ignore
